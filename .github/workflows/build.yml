name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl fakeroot clang dpkg unzip python3

      - name: Install ldid
        run: |
          curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid
          ldid -v || true

      - name: Install Theos & SDK 6.1
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

          # Скачиваем SDK iOS 6.1
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -o /tmp/sdks.zip -d /tmp/sdks
          mkdir -p $HOME/theos/sdks
          cp -r /tmp/sdks/sdks-master/iPhoneOS6.1.sdk $HOME/theos/sdks/
          echo "== SDKs available =="
          ls $HOME/theos/sdks

      - name: Unzip project
        run: |
          unzip -o style15.zip
          ls -la style15

      - name: Patch sources (imports + categories + S15Release)
        run: |
          cd style15
          python3 - <<'PY'
          import os, re

          # Категории, которые добавляем ПОСЛЕ импортов
          categories = """
          // --- Auto-generated S15Fix categories ---
          @interface SBIconImageView (S15Fix)
          @property (nonatomic) CGRect bounds;
          @property (nonatomic, readonly) CALayer *layer;
          @property (nonatomic, readonly) NSArray *subviews;
          @end

          @interface SBIconView (S15Fix)
          @property (nonatomic) CGAffineTransform transform;
          @end

          @interface SBDockView (S15Fix)
          @property (nonatomic, readonly) UIView *superview;
          @property (nonatomic, readonly) NSArray *subviews;
          @property (nonatomic) CGRect bounds;
          - (UIView *)viewWithTag:(NSInteger)tag;
          @end

          @interface SBIconBadgeView (S15Fix)
          @property (nonatomic, readonly) NSArray *subviews;
          @property (nonatomic, strong) UIColor *backgroundColor;
          @property (nonatomic, readonly) CALayer *layer;
          @property (nonatomic) CGRect bounds;
          @end

          @interface UIStatusBar (S15Fix)
          @property (nonatomic, readonly) NSArray *subviews;
          @property (nonatomic) CGRect bounds;
          @end
          // -----------------------------------------
          """

          for root, _, files in os.walk('Source'):
              for f in files:
                  if not f.endswith('.xm'):
                      continue
                  p = os.path.join(root, f)
                  text = open(p).read()

                  # 1. Гарантируем наличие базовых импортов
                  if '#import <UIKit/UIKit.h>' not in text:
                      text = '#import <UIKit/UIKit.h>\n' + text
                  if '#import <QuartzCore/QuartzCore.h>' not in text:
                      text = '#import <QuartzCore/QuartzCore.h>\n' + text

                  # 2. Вставляем категории после последнего #import
                  lines = text.splitlines()
                  last_import = -1
                  for i, line in enumerate(lines):
                      if line.strip().startswith('#import'):
                          last_import = i
                  if last_import == -1:
                      # если импортов не было (маловероятно), вставляем после первых строк
                      insert_at = 0
                  else:
                      insert_at = last_import + 1
                  lines.insert(insert_at, categories)
                  text = '\n'.join(lines)

                  # 3. Фикс S15Release: принимаем id и приводим к UIView*
                  text = re.sub(r'static\s+void\s+S15Release\s*\(\s*UIView\s*\*\s*v\s*\)',
                                'static void S15Release(id v)', text)
                  # Внутри функции создаём локальную переменную view
                  text = re.sub(r'(static\s+void\s+S15Release\s*\(\s*id\s+v\s*\)\s*\{)',
                                r'\1\n    UIView *view = (UIView *)v;', text)
                  # Заменяем обращения к v на view внутри функции (эвристика)
                  text = re.sub(r'(static\s+void\s+S15Release\s*\(\s*id\s+v\s*\)\s*\{.*?\})',
                                lambda m: m.group(0).replace(' v)', ' view)').replace('(v)', '(view)').replace(' v.', ' view.'),
                                text, flags=re.S)
                  open(p, 'w').write(text)
                  print('patched', p)
          PY

      - name: Build
        run: |
          cd style15
          # Используем скачанный SDK 6.1, target iOS 6.0
          make package \
            TARGET=iphone:clang:latest:6.0 \
            ARCHS="armv7 armv7s" \
            ADDITIONAL_CFLAGS="-fno-modules -Wno-module-import-in-extern-c" \
            DEBUG=0 \
            FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: style15/packages/*.deb
