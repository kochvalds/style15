name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl fakeroot clang dpkg unzip

      - name: Install ldid
        run: |
          curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid
          ldid -v || true

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Unzip project
        run: |
          unzip -o style15.zip
          echo "== after unzip =="
          ls -la

      - name: Build
        run: |
          cd style15
          echo "== Makefile =="
          cat Makefile
          echo "== Building =="
          make package \
            TARGET=iphone:clang:latest:6.0 \
            ARCHS="armv7 armv7s" \
            DEBUG=0 \
            FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            style15/packages/*.deb
            packages/*.deb
