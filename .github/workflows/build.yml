name: Build Style15

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: style15-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS tweak package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1

      - name: Check archive
        shell: bash
        run: |
          set -euo pipefail
          test -s style15.zip || {
            echo "::error::style15.zip is missing or empty"
            exit 1
          }
          unzip -t style15.zip

      - name: Extract project and locate Makefile
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q style15.zip -d extracted

          mapfile -t makefiles < <(find extracted -type f -name Makefile -not -path '*/.theos/*' | sort)
          if [ "${#makefiles[@]}" -eq 0 ]; then
            echo "::error::No Theos Makefile found inside style15.zip"
            find extracted -maxdepth 4 -type f -print
            exit 1
          fi

          # The archive also contains an example tweak with its own Makefile.
          # Select the shallowest Makefile: this is the actual project root.
          min_depth=999
          project_makefile=""
          for makefile in "${makefiles[@]}"; do
            relative="${makefile#extracted/}"
            depth="$(awk -F/ '{print NF}' <<< "$relative")"
            if [ "$depth" -lt "$min_depth" ]; then
              min_depth="$depth"
              project_makefile="$makefile"
            elif [ "$depth" -eq "$min_depth" ]; then
              echo "::error::Multiple project-level Makefiles found at the same depth"
              printf '%s\\n' "$project_makefile" "$makefile"
              exit 1
            fi
          done

          project_dir="$(dirname "$project_makefile")"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $project_dir"
          ls -la "$project_dir"

      - name: Build Debian package
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          make package FINALPACKAGE=1

          shopt -s nullglob
          packages=(packages/*.deb)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::Theos build completed without producing a .deb package"
            exit 1
          fi
          printf 'Built package: %s\n' "${packages[@]}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: style15-deb
          path: ${{ steps.project.outputs.project_dir }}/packages/*.deb
          if-no-files-found: error
          retention-days: 14
