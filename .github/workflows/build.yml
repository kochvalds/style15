name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl fakeroot clang dpkg

      - name: Install ldid
        run: |
          curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid
          ldid -v || true

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Debug
        run: |
          echo "== pwd =="; pwd
          echo "== THEOS =="; echo "$THEOS"
          echo "== ls -la =="; ls -la
          echo "== Makefiles =="; find . -maxdepth 4 -name Makefile -not -path './.git/*'
          echo "== Root Makefile (if any) =="; [ -f Makefile ] && cat Makefile || echo "(no Makefile in root)"

      - name: Build
        run: |
          if [ -f Makefile ]; then
            echo "Building at repo root"
            make package
          elif [ -f style15/Makefile ]; then
            echo "Building in style15/"
            cd style15 && make package
          else
            echo "No Makefile found — see Debug output above"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            packages/*.deb
            style15/packages/*.deb
