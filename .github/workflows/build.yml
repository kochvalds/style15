name: Build Tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        # Это действие само скачает Theos и популярные SDK,
        # включая старые версии.

      - name: Unzip project
        run: |
          unzip -o style15.zip
          cd style15
          
          # ВАЖНО: Нам всё ещё нужен наш патч для исходников
          # Вставьте сюда шаг "Patch sources" из Варианта 1
          # ...
          ls -la

      - name: Build Package
        run: |
          cd style15
          # Указываем Theos использовать SDK 6.1
          make package TARGET=iphone:clang:6.1:6.0 ARCHS="armv7 armv7s" ADDITIONAL_CFLAGS="-fno-modules"

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: style15-deb
          path: style15/packages/*.deb
